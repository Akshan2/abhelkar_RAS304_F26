site_name: RAS 304 Data Sheet Template
site_url: https://ras-embedded-systems.github.io/RAS304DataSheetTemplate/
repo_url: https://github.com/akshan2/abhelkar_RAS304_F26
edit_uri: edit/main/docs/
edit_uri: edit/main/docs/

nav:
  - Welcome: index.md
  - 01 Block Diagram: 01-Block-Diagram/Block-Diagram.md
  - 02 Component Selection: 02-Component-Selection/Component-Selection.md
  - 03 BOM: 03-BOM/BOM.md
  - 04 Schematic: 04-Schematic/Schematic.md
  - 05 PCB Design: 05-PCB-Design/PCB-Design.md
  - 06 Power Budget: 05-Power-Budget/Power-Budget.md
  - Appendix: Appendix/index.md
theme:
  name: material
  custom_dir: custom_theme/
  palette:
    primary: blue
    accent: indigo
  font:
    text: Roboto
  logo: static/logo304.svg
  favicon: static/logo304.png

  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - toc.follow    
    - navigation.top
    - navigation.path
    - navigation.indexes
    - navigation.prune
    - content.action.edit
    - navigation.footer
#    - navigation.sections
#    - navigation.expand
#    - navigation.instant # doesn't work that well

markdown_extensions:
  - attr_list #add attributes using curly brackets to images, see https://squidfunk.github.io/mkdocs-material/reference/images/
  - md_in_html # see https://squidfunk.github.io/mkdocs-material/reference/images/
  - footnotes
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tilde: {}
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

draft_docs: |
  **/*_unpublished.md
  **/*_draft.md
  **/*_draft**
  
plugins:
  - search
  - glightbox # allow resize images, see https://squidfunk.github.io/mkdocs-material/reference/images/

extra_css:
  - stylesheets/extra.css  

extra_javascript:
 - javascripts/mathjax.js
 - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
    
not_in_nav: |
  static
  
copyright: "Copyright &copy; 2025 team-name-here"

extra:
  generator: false
  social:
    - icon: fontawesome/regular/file-code
      link: /2025_fall
      name: 2023 Site    
